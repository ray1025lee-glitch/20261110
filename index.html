
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Dog Fighter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #caf0f8;
  touch-action: none;
  font-family: Arial, sans-serif;
}

#game-layout {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

#game-container {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
  overflow: hidden;
}

canvas {
  display: block;
  image-rendering: pixelated;
}

#controls {
  display: none;
  flex-shrink: 0;
  width: 100%;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 8px max(8px, env(safe-area-inset-right))
           8px max(8px, env(safe-area-inset-left));
  background: #1e293b;
}

.player-controls {
  display: flex;
  align-items: center;
  gap: clamp(3px, 0.8vw, 12px);
}

.control-button {
  width: clamp(34px, 6.5vw, 64px);
  height: clamp(34px, 6.5vw, 64px);
  border: 2px solid #ffffff88;
  border-radius: 10px;
  background: #475569;
  color: white;
  font-size: clamp(12px, 2vw, 20px);
  font-weight: bold;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.control-button.pressed {
  background: #0ea5e9;
}

.jump { background: #16a34a; }
.attack { background: #dc2626; }

#rotate-message {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #0f172a;
  color: white;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 22px;
  padding: 24px;
}

@media (pointer: coarse) {
  #controls {
    display: flex;
  }
}

@media (pointer: coarse) and (orientation: portrait) {
  #rotate-message {
    display: flex;
  }
}

@media (max-height: 420px) {
  #controls { padding-top: 3px; padding-bottom: 3px; }
}
</style>
</head>

<body>

<div id="game-layout">

  <div id="game-container"></div>

  <div id="controls">

    <div class="player-controls">
      <button class="control-button" data-control="p1left">◀</button>
      <button class="control-button" data-control="p1right">▶</button>
      <button class="control-button jump" data-control="p1jump">跳</button>
      <button class="control-button attack" data-control="p1attack">攻</button>
    </div>

    <div class="player-controls">
      <button class="control-button" data-control="p2left">◀</button>
      <button class="control-button" data-control="p2right">▶</button>
      <button class="control-button jump" data-control="p2jump">跳</button>
      <button class="control-button attack" data-control="p2attack">攻</button>
    </div>

  </div>
</div>

<div id="rotate-message">
  請將手機旋轉為橫向遊玩
</div>

<script src="sketch.js"></script>
</body>
</html>
